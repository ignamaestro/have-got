<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Have Got Monkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&family=Bebas+Neue&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: misma "diapositiva" a pantalla completa que la Monkey List; todo escala con cqmin. */
:root{
  --sky:#abc8dd; --sky-deep:#8fb3cf; --ink:#1f2340; --sun:#f6d04d; --sun-shadow:#d9a92a;
  --white:#ffffff; --orb:#4f8fe0;
  --have:#2f6fde;   /* I / you / we / they */
  --has:#e0457b;    /* he / she / it */
  --yes:#2fa84f; --no:#e53935; --ask:#f39c12;
  --card:#ffffff; --muted:#5b6385;
  --display:"Amaranth","Trebuchet MS",system-ui,sans-serif;
  --button:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--white);font-family:var(--display);overflow:hidden}
#app{position:relative;height:100%;container-type:size}
.screen{position:absolute;inset:0;padding-inline:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqmin;text-align:center}
.screen[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700;line-height:1.05;text-wrap:balance;text-shadow:0 .4cqmin 0 rgba(31,35,64,.12)}
.emoji{font-family:var(--emoji);line-height:1.1;font-weight:400}
button{font:inherit}
.pill{font-family:var(--button);letter-spacing:.12em;color:var(--ink);background:var(--sun);border:.55cqmin solid var(--ink);border-radius:999px;box-shadow:0 .9cqmin 0 var(--sun-shadow);cursor:pointer;padding:.6em 1.6em .45em;line-height:1;transition:transform .12s}
.pill:hover{transform:translateY(-.3cqmin)}
.pill:active{transform:translateY(.5cqmin);box-shadow:0 .3cqmin 0 var(--sun-shadow)}
.pill.small{font-size:4cqmin}
:focus-visible{outline:.6cqmin solid var(--ink);outline-offset:.6cqmin}
.icon-btn{background:var(--white);border:.5cqmin solid var(--ink);border-radius:999px;width:8.5cqmin;height:8.5cqmin;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 .7cqmin 0 var(--sky-deep)}
.icon-btn svg{width:58%;height:58%}
.corner{position:absolute;top:2.5cqmin;right:2.5cqmin;z-index:5;width:7cqmin;height:7cqmin}
.bar{pointer-events:none;position:absolute;left:16px;right:16px;bottom:3cqmin;display:flex;align-items:center;justify-content:space-between;gap:2cqmin}
.bar>*{pointer-events:auto}
.counter{font-family:var(--button);letter-spacing:.12em;font-size:4cqmin;color:var(--ink);opacity:.7;font-variant-numeric:tabular-nums}
.have{color:var(--have)} .has{color:var(--has)}

/* Portada */
#start h1{font-size:12cqmin}
#start .sub{font-size:6.5cqmin;font-weight:700}
#start img{height:30cqmin;width:auto;max-width:100%;animation:wave 2.4s ease-in-out infinite;transform-origin:50% 90%}
#start .pill{font-size:7cqmin}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}

/* Menú */
#menu h2{font-size:9cqmin}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.6cqmin;width:min(100%,150cqmin)}
@container (max-aspect-ratio: 1/1){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--white);border:none;border-radius:3cqmin;box-shadow:0 .9cqmin 0 var(--sky-deep);padding:2.4cqmin 1.4cqmin;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1cqmin;transition:transform .15s;min-width:0}
.tile:hover{transform:translateY(-.6cqmin) rotate(-1deg)}
.tile .emoji{font-size:11cqmin}
.tile .lbl{font-weight:700;font-size:4.4cqmin;line-height:1.05;color:var(--c)}
.tile .es{font-size:3cqmin;color:var(--muted)}
.tile .best{font-family:var(--button);letter-spacing:.1em;font-size:3cqmin;color:var(--ink);opacity:.6;min-height:1.2em}

/* Teoría */
#learn{justify-content:flex-start;padding-block:5cqmin 14cqmin}
#learn h2{font-size:8.5cqmin}
.lesson{flex:1;width:min(100%,128cqmin);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6cqmin;min-height:0}
.es-note{background:rgba(255,255,255,.88);color:var(--ink);border-radius:2cqmin;padding:1cqmin 2.4cqmin;font-size:3.8cqmin;max-width:100%}
.es-note b{color:var(--has)}
.ex-list{display:flex;flex-direction:column;gap:1.6cqmin;width:100%}
.ex{display:flex;align-items:center;gap:2.4cqmin;background:var(--card);color:var(--ink);border:none;border-radius:2.4cqmin;padding:1.2cqmin 2.4cqmin;box-shadow:0 .7cqmin 0 var(--sky-deep);cursor:pointer;text-align:left;font-size:5cqmin;font-weight:700;line-height:1.15}
.ex .emoji{font-size:7cqmin;flex:none;min-width:12cqmin;text-align:center}
.ex .txt{min-width:0;flex:1}
.ex .spk{flex:none;width:5cqmin;height:5cqmin;opacity:.55}
.ex.speaking{outline:.6cqmin solid var(--sun)}
.ex small{display:block;font-size:3.2cqmin;font-weight:400;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3cqmin;width:100%}
.col{background:var(--card);border-radius:3cqmin;padding:2.4cqmin;color:var(--ink);box-shadow:0 .9cqmin 0 var(--sky-deep);display:flex;flex-direction:column;align-items:center;gap:1.4cqmin}
.col .who{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2cqmin}
.chip{font-weight:700;font-size:4.6cqmin;padding:.3em .7em;border-radius:999px;background:var(--bg);color:var(--white)}
.col .verb{font-family:var(--button);font-size:10cqmin;letter-spacing:.06em;line-height:1}
.col .pics{font-family:var(--emoji);font-size:6cqmin}
.big-say{display:flex;align-items:center;gap:3cqmin}
.big-say img{height:30cqmin;width:auto}
.bubble{background:var(--white);color:var(--ink);border-radius:4cqmin;padding:2.4cqmin 3.4cqmin;font-size:7cqmin;font-weight:700;position:relative;border:none;cursor:pointer;box-shadow:0 .9cqmin 0 var(--sky-deep)}
.bubble::before{content:"";position:absolute;left:-2.6cqmin;top:50%;border:1.6cqmin solid transparent;border-right:2.6cqmin solid var(--white);transform:translateY(-50%)}
.table-wrap{width:100%;overflow-x:auto}
table.sum{width:100%;border-collapse:separate;border-spacing:1cqmin;color:var(--ink);font-size:4cqmin}
table.sum th{font-family:var(--button);letter-spacing:.08em;font-size:4.4cqmin;font-weight:400;padding:.6cqmin 1cqmin;border-radius:1.4cqmin;color:var(--white)}
table.sum td{background:var(--card);border-radius:1.4cqmin;padding:1cqmin 1.6cqmin;font-weight:700;text-align:left;line-height:1.25}
table.sum td.h{background:transparent;color:var(--ink);text-align:center;font-family:var(--emoji);font-size:5cqmin}
.k-have{color:var(--have)} .k-has{color:var(--has)}

/* Juegos */
.game{justify-content:flex-start;gap:1.6cqmin;padding-block:3cqmin 13cqmin}
.game h2{font-size:7cqmin}
.hud{display:flex;gap:2.4cqmin;align-items:center;font-family:var(--button);letter-spacing:.1em;font-size:4cqmin;color:var(--ink)}
.hud .stars{font-family:var(--emoji);letter-spacing:0}
.board{flex:1;width:min(100%,130cqmin);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:2cqmin;min-height:0}
.scene{display:flex;align-items:center;gap:2cqmin;font-family:var(--emoji);font-size:11cqmin;line-height:1}
.scene .who-name{font-family:var(--display);font-size:4.4cqmin;font-weight:700;color:var(--ink);display:block;margin-top:.6cqmin}
.scene .person{display:flex;flex-direction:column;align-items:center}
.scene .person img{height:12cqmin;width:auto}
.scene .obj{position:relative}
.scene .mark{position:absolute;right:-2cqmin;top:-2cqmin;font-size:6cqmin}
.badge{font-family:var(--button);letter-spacing:.1em;font-size:3.6cqmin;padding:.35em .9em .25em;border-radius:999px;color:var(--white);background:var(--bg)}
.sentence{background:var(--card);color:var(--ink);border-radius:3cqmin;padding:2cqmin 3.4cqmin;font-size:6.6cqmin;font-weight:700;box-shadow:0 .9cqmin 0 var(--sky-deep);line-height:1.3;max-width:100%}
.gap{display:inline-block;min-width:22cqmin;border-bottom:.6cqmin dashed var(--ink);color:var(--have)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:2.4cqmin}
.opt{font-family:var(--display);font-weight:700;font-size:5.6cqmin;color:var(--ink);background:var(--white);border:.55cqmin solid var(--ink);border-radius:2.4cqmin;padding:.5em 1.1em;cursor:pointer;box-shadow:0 .8cqmin 0 var(--sky-deep);transition:transform .12s}
.opt:hover{transform:translateY(-.3cqmin)}
.opt.right{background:#c9f2d3;border-color:var(--yes)}
.opt.wrong{background:#ffd1cf;border-color:var(--no);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-1cqmin)}75%{transform:translateX(1cqmin)}}
.feedback{min-height:8cqmin;font-size:4.6cqmin;font-weight:700;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1cqmin 2.4cqmin}
.feedback .ok{color:var(--yes)} .feedback .ko{color:var(--no)}
.next-btn{font-size:4.4cqmin}
.slots{min-height:11cqmin;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:1.4cqmin;background:rgba(255,255,255,.35);border:.5cqmin dashed var(--white);border-radius:3cqmin;padding:1.6cqmin}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6cqmin;min-height:9cqmin}
.wtile{font-family:var(--display);font-weight:700;font-size:5.2cqmin;color:var(--ink);background:var(--sun);border:.5cqmin solid var(--ink);border-radius:1.6cqmin;padding:.3em .7em;cursor:pointer;box-shadow:0 .7cqmin 0 var(--sun-shadow)}
.wtile.placed{background:var(--white);box-shadow:0 .7cqmin 0 var(--sky-deep)}
.slots.good{background:#c9f2d3;border-color:var(--yes)} .slots.bad{background:#ffd1cf;border-color:var(--no)}
.card{background:var(--card);color:var(--ink);border-radius:3cqmin;padding:1.4cqmin 3cqmin;box-shadow:0 .9cqmin 0 var(--sky-deep);display:flex;align-items:center;gap:3cqmin}
.card .person{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:4.4cqmin}
.card .person .emoji{font-size:10cqmin}
.inv{display:grid;grid-template-columns:repeat(5,auto);gap:1.6cqmin}
.inv span{position:relative;font-family:var(--emoji);font-size:7.4cqmin;line-height:1}
.inv span.not{opacity:.5}
.inv span.not::after{content:"";position:absolute;left:-4%;right:-4%;top:46%;height:.9cqmin;background:var(--no);transform:rotate(-35deg);border-radius:1cqmin}
.q-line{display:flex;align-items:center;gap:2cqmin}
.q-line .sentence{font-size:5.6cqmin}
#board .opts .opt{font-size:4.6cqmin;padding:.4em .8em}

/* Final */
#result h2{font-size:10cqmin}
#result .bigstars{font-family:var(--emoji);font-size:15cqmin;letter-spacing:.1em}
#result .score{font-size:6cqmin;font-weight:700;color:var(--ink)}
#result .row{display:flex;gap:3cqmin;flex-wrap:wrap;justify-content:center}
#result .pill{font-size:5cqmin}
.toast{position:absolute;left:50%;bottom:2cqmin;transform:translateX(-50%);background:var(--ink);color:var(--white);font-size:3cqmin;padding:.6em 1em;border-radius:1.5cqmin;max-width:90%;z-index:6}
.orb{position:absolute;top:50%;transform:translateY(-50%);width:11cqmin;height:11cqmin;border-radius:50%;border:.6cqmin solid #2c63b5;background:radial-gradient(circle at 35% 30%,#d9ebff 0 18%,#8cbcf3 40%,var(--orb) 75%,#2c63b5 100%);box-shadow:0 .8cqmin 1.6cqmin rgba(31,35,64,.25);cursor:pointer;display:grid;place-items:center;padding:0;z-index:3}
.orb svg{width:55%;height:55%} .orb:disabled{opacity:.3;cursor:default}
.orb.prev{left:2.5cqw}.orb.next{right:2.5cqw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <button class="icon-btn corner" id="fs" type="button" aria-label="Pantalla completa">

  </button>

  robot:['a robot','🤖'], kite:['a kite','🪁'], doll:['a doll','🪆'], teddy:['a teddy bear','🧸'], computer:['a computer','💻'],
  phone:['a phone','📱'], watch:['a watch','⌚'], cap:['a baseball cap','🧢'], glasses:['glasses','👓'], bag:['a bag','🎒'],
  umbrella:['an umbrella','☂️'], book:['a book','📕'], apple:['an apple','🍎'], banana:['a banana','🍌'], crayons:['crayons','🖍️'],
  pencil:['a pencil','✏️'], eyes:['three eyes','👁️'], teeth:['big teeth','🦷'], hat:['a hat','🎩'], nose:['a nose','👃'], tail:['a tail','🐒']
};
/* Personajes: third = he/she/it (has got) */
const PEOPLE = {
  me:   {subj:'I',   pron:'I',    third:false, name:'Monkey',      img:true,     has:['banana','kite','cap'],      hasnt:['phone','cat']},
  you:  {subj:'You', pron:'you',  third:false, name:'You',         emoji:'🫵',   has:['bag','pencil','apple'],     hasnt:['phone','horse']},
  we:   {subj:'We',  pron:'we',   third:false, name:'We',          emoji:'🧑‍🤝‍🧑', has:['book','crayons','computer'],hasnt:['robot','dog']},
  anna: {name:'Anna', pron:'she', third:true,  emoji:'👧',          has:['cat','doll','glasses'],     hasnt:['dog','computer']},
  ben:  {name:'Ben',  pron:'he',  third:true,  emoji:'👦',          has:['dog','robot','watch'],      hasnt:['cat','umbrella']},
  lucy: {name:'Lucy', pron:'she', third:true,  emoji:'👧🏼',        has:['bird','umbrella','crayons'], hasnt:['horse','phone']},
  tom:  {name:'Tom',  pron:'he',  third:true,  emoji:'👦🏽',        has:['horse','computer','cap'],   hasnt:['fish','glasses']},
  twins:{name:'Sam and Kim', pron:'they', third:false, emoji:'👫', has:['fish','kite','teddy'],     hasnt:['robot','bird']},
  monster:{name:'The monster', pron:'it', third:true, emoji:'👾',  has:['eyes','teeth','hat'],      hasnt:['nose','glasses']}
};
const THIRD_KEYS = ['anna','ben','lucy','tom','twins','monster'];
const ALL_KEYS = Object.keys(PEOPLE);
const cap = s => s[0].toUpperCase()+s.slice(1);

function subjectOf(p, useName){
  if(p.subj) return p.subj;
  return useName ? p.name : cap(p.pron);
}
function qSubject(p, useName){ // dentro de pregunta
  if(p.subj) return p.subj==='I' ? 'I' : p.subj.toLowerCase();
  return useName ? (p.name==='The monster' ? 'the monster' : p.name) : p.pron;
}
function build(p, type, itemKey, useName){
  const obj = ITEMS[itemKey][0];
  if(type==='aff') return `${subjectOf(p,useName)} ${p.third?'has':'have'} got ${obj}.`;
  if(type==='neg') return `${subjectOf(p,useName)} ${p.third?"hasn't":"haven't"} got ${obj}.`;
  return `${p.third?'Has':'Have'} ${qSubject(p,useName)} got ${obj}?`;
}
function shortAnswer(pron, yes){
  const third = ['he','she','it'].includes(pron);
  const P = cap(pron==='you'?'I':pron);
  return yes ? `Yes, ${pron==='you'?'I':pron} ${third?'has':'have'}.` : `No, ${pron==='you'?'I':pron} ${third?"hasn't":"haven't"}.`;
}
function avatar(p, big){
  return p.img ? `<img src="${MONKEY}" alt="">` : `<span>${p.emoji}</span>`;
}

/* ===== Voz (inglés británico del navegador) ===== */
let voice=null;
function pickVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const en=vs.filter(v=>/^en[-_]/i.test(v.lang));
  voice = en.find(v=>/en[-_]GB/i.test(v.lang)&&/Sonia|Libby|Natural|Google UK English Female/i.test(v.name))
       || en.find(v=>/en[-_]GB/i.test(v.lang)) || en[0] || null;
}
if(window.speechSynthesis){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
let learnAudio=null;
function stopLearn(){ if(learnAudio){ learnAudio.pause(); learnAudio=null; } }
function playLearn(text, onend){
  stopLearn(); try{speechSynthesis.cancel();}catch(e){}
  const src=LEARN_AUDIO[text];
  if(!src){ speak(text,onend); return; }
  const a=new Audio(src); learnAudio=a;
  a.onended=()=>onend&&onend(); a.onerror=()=>speak(text,onend);
  a.play().catch(()=>speak(text,onend));
}
function speak(text, onend){
  stopLearn();
  if(!window.speechSynthesis){ onend&&onend(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/👁️/g,''));
  if(voice){u.voice=voice;u.lang=voice.lang;} else u.lang='en-GB';
  u.rate=.82; u.onend=()=>onend&&onend(); u.onerror=()=>onend&&onend();
  speechSynthesis.speak(u);
}
/* Sonidos de acierto / error */
let actx=null;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [660,880] : [300,220];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,actx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(ok?.18:.08,actx.currentTime+i*.12+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.12+.18);o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*.12);o.stop(actx.currentTime+i*.12+.2);});
  }catch(e){}
}

/* ===== Pantallas ===== */
const SCREENS=['start','menu','learn','game','result'];
function show(id){ SCREENS.forEach(s=>$(s).hidden=(s!==id)); try{speechSynthesis.cancel();}catch(e){} stopLearn(); if(id==='menu') paintBest(); }
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>show('menu'));
$('go').onclick=()=>{ pickVoice(); show('menu'); };
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{ const g=t.dataset.go; if(g==='learn') openLearn(); else startGame(g); });
$('fs').onclick=async()=>{ try{ document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); }catch(e){ toast('Este navegador no permite pantalla completa aquí.'); } };
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000);}

/* ===== Récords (solo en este dispositivo) ===== */
function getBest(k){ try{ return +localStorage.getItem('hg-best-'+k)||0; }catch(e){ return 0; } }
function setBest(k,v){ try{ if(v>getBest(k)) localStorage.setItem('hg-best-'+k,v); }catch(e){} }
function paintBest(){ document.querySelectorAll('[data-best]').forEach(el=>{ const b=getBest(el.dataset.best); el.textContent = b ? 'BEST: '+b+' / 10' : ''; }); }

/* ===== LEARN ===== */
const exBtn = (emoji, html, say, es) => `<button class="ex" type="button" data-say="${esc(say)}"><span class="emoji">${emoji}</span><span class="txt">${html}${es?`<small>${es}</small>`:''}</span><svg class="spk" viewBox="0 0 24 24" fill="none" stroke="#1f2340" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>`;
const V = (w,cls) => `<span class="${cls}">${w}</span>`;
const LESSONS = [
  { t:'HAVE GOT = TENER', html:()=>`
      <div class="big-say"><img src="${MONKEY}" alt=""><button class="bubble" type="button" data-say="I have got a banana.">I ${V('have got','have')} a banana! <span class="emoji">🍌</span></button></div>
      <div class="es-note"><b>have got / has got</b> significa <b>tener</b>.</div>`},
  { t:'WHO? ¿QUIÉN?', html:()=>`
      <div class="cols">
        <div class="col"><div class="who">${['I','you','we','they'].map(w=>`<span class="chip" style="--bg:var(--have)">${w}</span>`).join('')}</div>
          <div class="verb have">HAVE GOT</div><div class="pics">🐒 🫵 🧑‍🤝‍🧑 👫</div></div>
        <div class="col"><div class="who">${['he','she','it'].map(w=>`<span class="chip" style="--bg:var(--has)">${w}</span>`).join('')}</div>
          <div class="verb has">HAS GOT</div><div class="pics">👦 👧 👾</div></div>
      </div>
      <div class="es-note">Con <b>he, she, it</b> (o un nombre: Anna, Ben…) usamos <b>has got</b>.</div>`},
  { t:'✔ YES! AFIRMATIVA', html:()=>`
      <div class="ex-list">
        ${exBtn('🐒🍌', `I ${V('have got','have')} a banana.`, 'I have got a banana.', 'I\'ve got = I have got')}
        ${exBtn('👦🐶', `Ben ${V('has got','has')} a dog.`, 'Ben has got a dog.', 'He\'s got = He has got')}
        ${exBtn('👫🪁', `Sam and Kim ${V('have got','have')} a kite.`, 'Sam and Kim have got a kite.', 'They\'ve got = They have got')}
        ${exBtn('👾👁️', `The monster ${V('has got','has')} three eyes!`, 'The monster has got three eyes!')}
      </div>`},
  { t:'✘ NO! NEGATIVA', html:()=>`
      <div class="ex-list">
        ${exBtn('🐒📱', `I ${V("haven't got",'have')} a phone.`, "I haven't got a phone.", "haven't = have not")}
        ${exBtn('👧🐶', `Anna ${V("hasn't got",'has')} a dog.`, "Anna hasn't got a dog.", "hasn't = has not")}
        ${exBtn('👫🤖', `They ${V("haven't got",'have')} a robot.`, "They haven't got a robot.")}
      </div>
      <div class="es-note">Para decir que <b>no</b> tenemos algo: <b>haven't got / hasn't got</b>.</div>`},
  { t:'❓ QUESTIONS · PREGUNTAS', html:()=>`
      <div class="ex-list">
        ${exBtn('🫵🐱', `${V('Have','have')} you got a cat?`, 'Have you got a cat? Yes, I have. No, I haven\'t.', 'Yes, I have. 👍 &nbsp;/&nbsp; No, I haven\'t. 👎')}
        ${exBtn('👧👓', `${V('Has','has')} Anna got glasses?`, 'Has Anna got glasses? Yes, she has.', 'Yes, she has. 👍')}
        ${exBtn('👦☂️', `${V('Has','has')} Ben got an umbrella?`, "Has Ben got an umbrella? No, he hasn't.", 'No, he hasn\'t. 👎')}
      </div>
      <div class="es-note">Para preguntar, <b>Have / Has</b> va al principio. ¡Y <b>got</b> se queda en su sitio!</div>`},
  { t:'REMEMBER!', html:()=>`
      <div class="table-wrap"><table class="sum">
        <tr><td class="h"></td><th style="background:var(--yes)">✔ YES</th><th style="background:var(--no)">✘ NO</th><th style="background:var(--ask)">❓ QUESTION</th></tr>
        <tr><td class="h">🐒🫵🧑‍🤝‍🧑👫</td><td>I / you / we / they <span class="k-have">have got</span></td><td>I / you / we / they <span class="k-have">haven't got</span></td><td><span class="k-have">Have</span> you got…?<br>Yes, I have. / No, I haven't.</td></tr>
        <tr><td class="h">👦👧👾</td><td>he / she / it <span class="k-has">has got</span></td><td>he / she / it <span class="k-has">hasn't got</span></td><td><span class="k-has">Has</span> she got…?<br>Yes, she has. / No, she hasn't.</td></tr>

];
let li=0;
function openLearn(){ li=0; show('learn'); renderLesson(); }
function renderLesson(){
  stopLearn(); const L=LESSONS[li]; $('lTitle').textContent=L.t; $('lBody').innerHTML=L.html();
  $('lCount').textContent=(li+1)+' / '+LESSONS.length; $('lPrev').disabled=li===0; $('lNext').disabled=li===LESSONS.length-1;
  $('lBody').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.ex.speaking').forEach(x=>x.classList.remove('speaking')); b.classList.add('speaking'); playLearn(b.dataset.say,()=>b.classList.remove('speaking')); });
}
$('lPrev').onclick=()=>{ if(li>0){li--;renderLesson();} };
$('lNext').onclick=()=>{ if(li<LESSONS.length-1){li++;renderLesson();} };

/* ===== JUEGOS ===== */
const ROUNDS=10;
const TYPES = { aff:{label:'✔ YES', bg:'var(--yes)'}, neg:{label:'✘ NO', bg:'var(--no)'}, q:{label:'❓ QUESTION', bg:'var(--ask)'} };
let G=null;
function startGame(kind){
  G={kind, round:0, score:0, items:makeRounds(kind), current:null, done:false};
  $('gTitle').textContent = {choose:'HAVE OR HAS?', build:'MAKE SENTENCES', look:'LOOK AND ANSWER'}[kind];
  show('game'); nextRound();
}
function makeRounds(kind){
  const out=[]; let last='';
  while(out.length<ROUNDS){
    const keys = kind==='look' ? THIRD_KEYS : ALL_KEYS;
    const k = pick(keys); const p=PEOPLE[k];
    let type = kind==='look' ? 'q' : pick(['aff','aff','neg','q']);
    if(type==='q' && k==='me') type='aff';
    const yes = type==='q' ? Math.random()<.5 : type==='aff';
    const item = pick(yes ? p.has : p.hasnt);
    const sig=k+item+type; if(sig===last) continue; last=sig;
    out.push({k,p,type,item,yes,useName:Math.random()<.6});
  }
  return out;
}
function hud(){
  $('gRound').textContent = 'ROUND '+(G.round+1)+' / '+ROUNDS;
  $('gStars').textContent = '⭐ '+G.score;
}
function sceneHTML(r){
  const it=ITEMS[r.item]; const mark = r.type==='neg' ? '❌' : r.type==='q' ? '❓' : '✅';
  const who = r.p.subj ? r.p.subj : (r.useName ? r.p.name : cap(r.p.pron)+' ('+r.p.name+')');
  return `<div class="scene"><div class="person">${avatar(r.p)}<span class="who-name">${esc(r.p.name==='You'?'You':who)}</span></div>
    <span class="obj">${it[1]}<span class="mark">${mark}</span></span></div>`;
}
function nextRound(){
  if(G.round>=ROUNDS) return finish();
  G.done=false; hud();
  const r=G.items[G.round]; G.current=r;
  ({choose:roundChoose, build:roundBuild, look:roundLook})[G.kind](r);
}
function afterAnswer(ok, sentence, shown){
  G.done=true; if(ok) G.score++; hud(); beep(ok);
  setTimeout(()=>speak(sentence),250);
  const fb=$('board').querySelector('.feedback');
  fb.innerHTML = (ok?'<span class="ok">Well done! ⭐</span>':'<span class="ko">Oops!</span>') + (ok ? '' : ` <span>${esc(shown||sentence)}</span>`);
  const nb=document.createElement('button'); nb.className='pill next-btn'; nb.type='button'; nb.textContent=G.round===ROUNDS-1?'FINISH':'NEXT ▸';
  nb.onclick=()=>{ G.round++; nextRound(); };
  fb.appendChild(nb); nb.focus();
}

/* 1. HAVE OR HAS? */
function roundChoose(r){
  const full = build(r.p, r.type, r.item, r.useName);
  let gapped, opts, answer;
  if(r.type==='q'){ answer = r.p.third?'Has':'Have'; opts=['Have','Has']; gapped = full.replace(/^(Has|Have)/,'<span class="gap">&nbsp;</span>'); }
  else if(r.type==='neg'){ answer = r.p.third?"hasn't got":"haven't got"; opts=["haven't got","hasn't got"]; gapped = full.replace(/(hasn't|haven't) got/,'<span class="gap">&nbsp;</span>'); }
  else { answer = r.p.third?'has got':'have got'; opts=['have got','has got']; gapped = full.replace(/(has|have) got/,'<span class="gap">&nbsp;</span>'); }
  $('board').innerHTML = `${sceneHTML(r)}<span class="badge" style="--bg:${TYPES[r.type].bg}">${TYPES[r.type].label}</span>
    <div class="sentence">${gapped}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" type="button">${o}</button>`).join('')}</div><div class="feedback"></div>`;
  G.say = full;
  $('board').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.done) return;
    const ok = b.textContent===answer;
    $('board').querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.textContent===answer) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    $('board').querySelector('.gap').textContent = answer;
    afterAnswer(ok, full);
  });
}

/* 2. MAKE SENTENCES */
function roundBuild(r){
  const full = build(r.p, r.type, r.item, r.useName);
  const words = full.split(' ');
  G.target = words; G.placed = []; G.say = full;
  const order = shuffle(words.map((w,i)=>i));
  $('board').innerHTML = `${sceneHTML(r)}<span class="badge" style="--bg:${TYPES[r.type].bg}">${TYPES[r.type].label}</span>
    <div class="slots" id="slots" aria-label="Tu frase"></div>
    <div class="tiles" id="tiles">${order.map(i=>`<button class="wtile" type="button" data-i="${i}">${esc(words[i])}</button>`).join('')}</div>
    <div class="feedback"></div>`;
  $('tiles').querySelectorAll('.wtile').forEach(t=>t.onclick=()=>{
    if(G.done) return;
    t.classList.add('placed'); $('slots').appendChild(t); G.placed.push(t);
    t.onclick=()=>{ if(G.done) return; t.classList.remove('placed'); $('tiles').appendChild(t); G.placed=G.placed.filter(x=>x!==t); bindBack(t); };
    if(G.placed.length===words.length) checkBuild();
  });
  function bindBack(t){ t.onclick=()=>{ if(G.done) return; t.classList.add('placed'); $('slots').appendChild(t); G.placed.push(t); t.onclick=()=>{ if(G.done) return; t.classList.remove('placed'); $('tiles').appendChild(t); G.placed=G.placed.filter(x=>x!==t); bindBack(t); }; if(G.placed.length===words.length) checkBuild(); }; }
}
function checkBuild(){
  const got = G.placed.map(t=>t.textContent).join(' ');
  const ok = got===G.target.join(' ');
  $('slots').classList.add(ok?'good':'bad');
  if(!ok){ $('slots').innerHTML = G.target.map(w=>`<span class="wtile placed">${esc(w)}</span>`).join(''); }
  afterAnswer(ok, G.target.join(' '));
}

/* 3. LOOK AND ANSWER */
function roundLook(r){
  const q = build(r.p, 'q', r.item, true);
  const inv = shuffle([...r.p.has.map(k=>[k,true]), ...r.p.hasnt.map(k=>[k,false])]);
  const pron = r.p.pron;
  const other = {he:'she', she:'he', it:'they', they:'he'}[pron];
  const answer = shortAnswer(pron, r.yes);
  const opts = shuffle([shortAnswer(pron,true), shortAnswer(pron,false), shortAnswer(other, r.yes)]);
  G.say = q;
  $('board').innerHTML = `
    <div class="card"><div class="person"><span class="emoji">${r.p.emoji}</span>${esc(r.p.name)}</div>
      <div class="inv">${inv.map(([k,h])=>`<span class="${h?'':'not'}" title="${esc(ITEMS[k][0])}">${ITEMS[k][1]}</span>`).join('')}</div></div>
    <div class="q-line"><div class="sentence">${esc(q)}</div></div>
    <div class="opts">${opts.map(o=>`<button class="opt" type="button">${esc(o)}</button>`).join('')}</div><div class="feedback"></div>`;
  setTimeout(()=>speak(q),400);
  $('board').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.done) return;
    const ok = b.textContent===answer;
    $('board').querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.textContent===answer) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    afterAnswer(ok, q+' '+answer, answer);
  });
}

$('say').onclick=()=>{ if(G&&G.say) speak(G.done && G.kind==='look' ? G.say : G.say); };

function finish(){
  setBest(G.kind, G.score);
  const s=G.score, n = s>=9?3 : s>=6?2 : s>=3?1 : 0;
  $('rTitle').textContent = n===3?'AMAZING!': n===2?'GREAT JOB!': n===1?'GOOD TRY!':'KEEP PRACTISING!';
  $('rStars').textContent = '⭐'.repeat(n) + '☆'.repeat(3-n);
  $('rScore').textContent = s+' / '+ROUNDS;
  show('result');
  speak($('rTitle').textContent.toLowerCase());
}
$('again').onclick=()=>startGame(G.kind);

document.addEventListener('keydown',e=>{
  if(!$('learn').hidden){ if(e.key==='ArrowRight') $('lNext').click(); if(e.key==='ArrowLeft') $('lPrev').click(); }
  if(e.key==='Escape') show('menu');
  if(!$('game').hidden && G && G.done && (e.key==='Enter'||e.key==='ArrowRight')){ const nb=$('board').querySelector('.next-btn'); if(nb){ e.preventDefault(); nb.click(); } }
});
</script>
